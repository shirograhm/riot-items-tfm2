<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>TFM2 — Item Builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    :root {
      --bg: #0f0f12;
      --surface: #1a1a22;
      --card: #22222e;
      --border: #2e2e3e;
      --accent: #7b6ff0;
      --accent-bg: #1e1b3a;
      --accent-text: #a89cf5;
      --text: #e8e8f0;
      --muted: #888899;
      --sub: #555566;
      --warn: #c9962a;
      --warn-bg: #2a2010;
      --phys: #d4882a;
      --phys-bg: #2a1e0a;
      --mag: #7b6ff0;
      --mag-bg: #1e1b3a;
      --tank: #4caf7a;
      --tank-bg: #0f2018;
      --sup: #c06ab0;
      --sup-bg: #2a1028;
      --bruiser: #e0703f;
      --bruiser-bg: #2a140a;
      --sword: #e0a030;
      --sword-bg: #2a2008;
      --new: #e05555;
      --new-bg: #2a1010;
      --radius: 8px
    }

    html,
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6
    }

    #app {
      max-width: 740px;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem
    }

    .app-header {
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border)
    }

    .app-header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 3px
    }

    .app-header p {
      font-size: 13px;
      color: var(--muted)
    }

    .patch-badge {
      display: inline-block;
      margin-top: .5rem;
      padding: 3px 9px;
      background: var(--new-bg);
      color: var(--new);
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--new)
    }

    .tabs {
      display: flex;
      gap: 3px;
      margin-top: .75rem;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 3px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch
    }

    .tab {
      flex: 0 0 auto;
      padding: .45rem .6rem;
      text-align: center;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      border: none;
      background: none;
      white-space: nowrap;
      -webkit-appearance: none;
      transition: all .15s
    }

    .tab.active {
      background: var(--card);
      color: var(--text);
      font-weight: 500
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      min-height: 20px
    }

    .crumb {
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 0
    }

    .crumb:hover {
      color: var(--accent-text)
    }

    .crumb.active {
      color: var(--text);
      font-weight: 500;
      cursor: default
    }

    .sep {
      font-size: 11px;
      color: var(--sub)
    }

    .q-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: .7rem;
      line-height: 1.5
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 7px;
      margin-bottom: .875rem
    }

    .choice {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .75rem .85rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      text-align: left;
      -webkit-appearance: none
    }

    .choice:hover,
    .choice:active {
      border-color: var(--accent);
      background: var(--accent-bg)
    }

    .choice:hover .ct {
      color: var(--accent-text)
    }

    .ct {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
      line-height: 1.3
    }

    .cd {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4
    }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem;
      margin-bottom: .75rem
    }

    .result-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: .75rem
    }

    .result-icon {
      font-size: 22px;
      flex-shrink: 0;
      margin-top: 2px
    }

    .result-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.2
    }

    .result-meta {
      font-size: 12px;
      color: var(--muted)
    }

    .gold-badge {
      display: inline-block;
      padding: 2px 7px;
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      margin-left: 5px
    }

    .new-badge {
      display: inline-block;
      padding: 2px 6px;
      background: var(--new-bg);
      color: var(--new);
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 5px;
      vertical-align: middle
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: .75rem
    }

    .item-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: .55rem .65rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border)
    }

    .item-row.is-new {
      border-color: var(--new);
      background: var(--new-bg)
    }

    .item-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-bg);
      color: var(--accent-text);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px
    }

    .item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px
    }

    .item-cost {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px
    }

    .item-why {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4
    }

    .impact {
      margin: .15rem 0 .85rem;
      padding: .55rem .7rem;
      background: var(--accent-bg);
      border-left: 3px solid var(--accent);
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      line-height: 1.45
    }

    .impact-note {
      display: block;
      margin-top: .3rem;
      font-size: 11px;
      color: var(--muted)
    }

    .swaps {
      padding-top: .65rem;
      border-top: 1px solid var(--border)
    }

    .swaps-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--sub);
      margin-bottom: .45rem
    }

    .swap {
      font-size: 12px;
      color: var(--muted);
      padding: .3rem 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.5
    }

    .swap:last-child {
      border-bottom: none
    }

    .swap-if {
      color: var(--warn);
      font-weight: 500
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 10px;
      vertical-align: middle
    }

    .t-phys {
      background: var(--phys-bg);
      color: var(--phys)
    }

    .t-mag {
      background: var(--mag-bg);
      color: var(--mag)
    }

    .t-tank {
      background: var(--tank-bg);
      color: var(--tank)
    }

    .t-bruiser {
      background: var(--bruiser-bg);
      color: var(--bruiser)
    }

    .t-sup {
      background: var(--sup-bg);
      color: var(--sup)
    }

    .t-sword {
      background: var(--sword-bg);
      color: var(--sword)
    }

    .t-new {
      background: var(--new-bg);
      color: var(--new)
    }

    .t-neu {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border)
    }

    .btn-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: .625rem
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      padding: .42rem .8rem;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      -webkit-appearance: none;
      transition: all .15s
    }

    .btn:hover,
    .btn:active {
      color: var(--text);
      border-color: var(--accent)
    }

    .btn-accent {
      background: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent)
    }

    .sit-grid,
    .combo-grid,
    .new-grid {
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .sit-card,
    .combo-card,
    .new-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .85rem 1rem
    }

    .new-card {
      border-color: var(--new)
    }

    .sit-head {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer
    }

    .sit-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3
    }

    .arrow {
      margin-left: auto;
      font-size: 11px;
      color: var(--sub);
      transition: transform .2s;
      flex-shrink: 0
    }

    .sit-body {
      display: none;
      margin-top: .55rem;
      padding-top: .55rem;
      border-top: 1px solid var(--border)
    }

    .sit-body.open {
      display: block
    }

    .sit-item {
      font-size: 12px;
      color: var(--muted);
      padding: .3rem 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.5
    }

    .sit-item:last-child {
      border-bottom: none
    }

    .sit-item strong {
      color: var(--text);
      font-weight: 500
    }

    .combo-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px
    }

    .combo-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text)
    }

    .combo-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: .55rem
    }

    .combo-items {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: .45rem
    }

    .combo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      color: var(--text)
    }

    .combo-item.new {
      border-color: var(--new);
      color: var(--new)
    }

    .combo-why {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5
    }

    .new-stat {
      font-size: 12px;
      color: var(--muted);
      margin: .3rem 0;
      line-height: 1.5
    }

    .new-stat strong {
      color: var(--text)
    }

    .new-passive {
      background: var(--surface);
      border-radius: var(--radius);
      padding: .5rem .7rem;
      font-size: 12px;
      color: var(--muted);
      margin: .5rem 0;
      line-height: 1.5;
      border: 1px solid var(--border)
    }

    .new-passive .pname {
      color: var(--new);
      font-weight: 600
    }

    .new-section {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--sub);
      margin: .75rem 0 .4rem
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="app-header">
      <h1>TFM2 — Item Builder</h1>
      <p>Pick your role and situation → get the right build</p>
      <div class="patch-badge">🆕 Patch 0.9.10 — Game 0.6.0 support · 4th item slot now built into the game · Tiamat &amp; Bandlepipes</div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('build',this)">🎯 Build Picker</button>
        <button class="tab" onclick="switchTab('new',this)">🆕 New Items</button>
        <button class="tab" onclick="switchTab('sit',this)">⚡ Situational</button>
        <button class="tab" onclick="switchTab('combos',this)">💡 Combos</button>
      </div>
    </div>
    <div id="build-tab">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="content"></div>
    </div>
    <div id="new-tab" style="display:none">
      <div class="new-grid" id="new-content"></div>
    </div>
    <div id="sit-tab" style="display:none">
      <div class="sit-grid" id="sit-content"></div>
    </div>
    <div id="combos-tab" style="display:none">
      <div class="combo-grid" id="combo-content"></div>
    </div>
  </div>
  <script>
    // ── ALL BUILDS ────────────────────────────────────────────────────────────────
    const B = {
      // ADC
      adc_crit: {
        label: "Crit Machine", sub: "Squishy enemy comp, no heavy tanks", role: "phys", icon: "🏹",
        impact: "~17× damage · no extra durability",
        items: [
          { name: "Infinity Edge", cost: 5050, why: "50% crit + 30% crit damage from item 1. Every second hit is a critical" },
          { name: "Hamstringer", cost: 5400, why: "75% crit + bleed 2s + 7% slow on every crit. Enemy can't escape" },
          { name: "Phantom Dancer", cost: 5200, why: "100% crit + 10% MS. Now every single hit crits" },
          { name: "Deathblade", cost: 5250, why: "×1.25 to all your AD — the final multiplier that makes everything stronger" }
        ],
        swaps: [
          { cond: "Enemy comp has one heavy tank", action: "3rd: Lord Dominik's instead of Phantom Dancer — swap crit for crit so you stay at 100%" },
          { cond: "Enemies have healing", action: "3rd: Mortal Reminder instead of Phantom Dancer — swap crit for crit so you stay at 100%" },
          { cond: "Enemies heavy AP", action: "3rd: Wit's End instead of Phantom Dancer" }

        impact: "~19× damage · no extra durability",
        items: [
          { name: "Lord Dominik's Regards", cost: [5250, 5400], why: "Immediately ignores 35% armor + bonus damage scales with target max HP (up to +15%)" },
          { name: "Kraken Slayer", cost: 5200, why: "Every 3rd attack: 150+ bonus damage, maximized at 25% enemy HP" },
          { name: "Infinity Edge", cost: 5050, why: "75% crit total — stack crit on top of tank shred" },
          { name: "Deathblade", cost: 5250, why: "Final ×1.25 multiplier" }
        ],
        swaps: [
          { cond: "Enemies have healing", action: "3rd: Mortal Reminder instead of Infinity Edge" },
          { cond: "Need mobility", action: "3rd: Stormrazor instead of Infinity Edge" }
        ]
      },
      adc_antiheal: {
        label: "ADC vs Healing", sub: "Enemy team has strong heals", role: "phys", icon: "💉",
        impact: "~18× damage · no extra durability",
        items: [
          { name: "Infinity Edge", cost: 5050, why: "Core crit foundation" },
          { name: "Mortal Reminder", cost: [5200, 5350], why: "REQUIRED — reduces enemy healing by 40% on physical damage. Also +25% crit" },

        ],
        swaps: [
          { cond: "Enemies are tanky", action: "4th: Lord Dominik's" },
          { cond: "Enemies heal a lot", action: "4th: Mortal Reminder" }
        ]
      },
      adc_defense: {
        label: "ADC with Defense", sub: "One defensive item in the build", role: "phys", icon: "🛡️",

          { name: "Infinity Edge", cost: 5050, why: "50% crit from item 1 — keep damage as the foundation" },
          { name: "Sterak's Gage", cost: 5350, why: "DEFENSIVE SLOT: 650 HP + shield equal to 60% max HP at 30% health. Saves you from one burst combo" },

          { name: "Deathblade", cost: 5250, why: "Final ×1.25 multiplier" }

        swaps: [
          { cond: "Enemies have 2+ mages", action: "2nd: Wit's End instead of Sterak's (130 MR + 65% AS + 30% tenacity)" },

      },
      adc_melee: {

          { cond: "Enemies very tanky", action: "3rd: Voltaic Cyclosword instead of Phantom Dancer (10% current HP)" },
          { cond: "Want more damage", action: "4th: Deathblade instead of Death's Dance" }

      // ASSASSIN
      ass_snowball: {

          { name: "Collector", cost: 5350, why: "Executes below 6% HP + 25 bonus gold per kill. No one escapes" }
        ],
        swaps: [
          { cond: "Enemies are tanky", action: "4th: Voltaic Cyclosword instead of Collector (10% current HP damage)" },
          { cond: "Enemies have shields in kit", action: "1st: Serpent's Fang instead of Hubris" }
        ]
      },
      ass_antishield: {
        label: "Shield Breaker", sub: "Enemies have shields in kit", role: "phys", icon: "🗡️",
        impact: "~7.6× damage · no extra durability",
        items: [
          { name: "Serpent's Fang", cost: 4800, why: "Cheapest of the four. Hitting a shielded champion deals 85 + 15% AD bonus physical damage. Their shield is no longer protection" },
          { name: "Hubris", cost: 5050, why: "Permanent stacks from takedowns — 2nd so it has the most time to stack" },
          { name: "Opportunity", cost: 5050, why: "7s out of combat → +7 lethality. Lethal from the bushes" },
          { name: "Collector", cost: 5350, why: "Execute + gold — the finisher nobody survives" }
        ],
        swaps: [
          { cond: "Enemies have healing", action: "4th: Mortal Reminder instead of Collector" },
          { cond: "Enemies are very tanky", action: "3rd: Cyclosword instead of Opportunity (10% current HP damage)" }
        ]
      },
      ass_ult: {
        label: "Ultimate Machine", sub: "Ultimate is your primary weapon", role: "phys", icon: "🔱",
        impact: "~7.4× damage · no extra durability",
        items: [
          { name: "Axiom Arc", cost: 5000, why: "15 ability haste + 10 ult haste (+0.2 per lethality) — about −22% ult cooldown, more as lethality stacks" },
          { name: "Hubris", cost: 5050, why: "115 AD + kill stacks + more lethality = lower ult CD" },
          { name: "Voltaic Cyclosword", cost: 5050, why: "Charges → 10% current HP bonus damage. Kills tanks where ult alone can't" },
          { name: "Bastionbreaker", cost: 5050, why: "Kill → free tower damage after every ult" }
        ],
        swaps: [{ cond: "Enemies have huge HP pools", action: "3rd: Blade of the Ruined King instead of Cyclosword" }]
      },
      ass_burst: {
        label: "Pure Burst", sub: "One or two hits = death", role: "phys", icon: "💀",
        impact: "~9.1× damage · no extra durability",

    // ── ENGINE ────────────────────────────────────────────────────────────────────
    let path = [], current = "root";

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      ['build', 'new', 'sit', 'combos'].forEach(t => {
        document.getElementById(t + '-tab').style.display = t === tab ? '' : 'none';
      });
      if (tab === 'new') renderNew();
      if (tab === 'sit') renderSit();
      if (tab === 'combos') renderCombos();
    }

    function roleTag(r) {
      const m = { phys: ['t-phys', 'Physical'], mag: ['t-mag', 'Mage'], tank: ['t-tank', 'Tank'], bruiser: ['t-bruiser', 'Bruiser'], sup: ['t-sup', 'Support'], sword: ['t-sword', 'Swordsman'] };
      const [cls, label] = m[r] || ['t-neu', r];
      return `<span class="tag ${cls}">${label}</span>`;
    }

    function renderBC() {
      const bc = document.getElementById('breadcrumb');
      const steps = [{ label: 'Start' }, ...path.map(p => ({ label: p.label }))];
      bc.innerHTML = steps.map((s, i) => {
        const last = i === steps.length - 1;
        return `<span class="crumb${last ? ' active' : ''}" data-idx="${i}">${s.label}</span>${last ? '' : `<span class="sep">›</span>`}`;
      }).join('');
      bc.querySelectorAll('.crumb:not(.active)').forEach(el => {
        el.onclick = () => {
          const idx = parseInt(el.dataset.idx);
          path = path.slice(0, idx);
          current = path.length === 0 ? 'root' : path[path.length - 1].next;
          renderBuild();
        };
      });
    }

    function renderBuild() {
      renderBC();
      const c = document.getElementById('content');
      if (B[current]) { renderResult(current, c); return; }
      const node = TREE[current];
      if (!node) { c.innerHTML = '<p style="color:var(--muted)">Navigation error</p>'; return; }
      let h = `<p class="q-label">${node.q}</p><div class="choices">`;
      node.choices.forEach(ch => {
        h += `<div class="choice" data-next="${ch.n}" data-label="${ch.l}"><div class="ct">${ch.l}</div><div class="cd">${ch.d || ''}</div></div>`;
      });
      h += `</div>`;
      c.innerHTML = h;
      c.querySelectorAll('.choice').forEach(el => {
        el.onclick = () => { path.push({ label: el.dataset.label, next: el.dataset.next }); current = el.dataset.next; renderBuild(); };
      });
    }

    // Full build cost from the first component up. Items with alternative
    // component routes carry [min, max].
    function costRange(cost) { return Array.isArray(cost) ? cost : [cost, cost]; }
    function fmtGold(cost) {
      const [lo, hi] = costRange(cost);
      return lo === hi ? lo.toLocaleString() : `${lo.toLocaleString()}–${hi.toLocaleString()}`;
    }

    function renderResult(id, c) {
      const b = B[id];
      const namedItems = b.items.filter(i => i.cost);
      const lo = namedItems.reduce((a, i) => a + costRange(i.cost)[0], 0);
      const hi = namedItems.reduce((a, i) => a + costRange(i.cost)[1], 0);
      let h = `<div class="result-card"><div class="result-head"><div class="result-icon">${b.icon}</div><div>
    <div class="result-title">${b.label}</div>
    <div class="result-meta">${b.sub} &nbsp;${roleTag(b.role)}<span class="gold-badge">${fmtGold([lo, hi])} gold total</span></div>
  </div></div>${b.impact ? `<div class="impact"><strong>Impact:</strong> ${b.impact}<span class="impact-note">Baseline: An unbuilt champion (100 AD, 1.00 AS, 2,000 HP, 25 armor/MR) in a 10s fight with an 8,000 HP / 100 armor / 100 MR target. Ults, stacks, cleave and auras not counted.</span></div>` : ''}<div class="items-list">`;
      b.items.forEach((item, i) => {
        const newCls = item.isNew ? ' is-new' : '';
        const newBadge = item.isNew ? `<span class="new-badge">NEW ${item.patch || '0.9.7'}</span>` : '';
        h += `<div class="item-row${newCls}"><div class="item-num">${i + 1}</div><div>
      <div class="item-name">${item.name}${newBadge}</div>
      ${item.cost ? `<div class="item-cost">${fmtGold(item.cost)} gold</div>` : ''}
      <div class="item-why">${item.why}</div>
    </div></div>`;
      });
      h += `</div>`;
      if (b.swaps && b.swaps.length) {
        h += `<div class="swaps"><div class="swaps-title">Situational Swaps</div>`;
        b.swaps.forEach(s => { h += `<div class="swap"><span class="swap-if">If ${s.cond}</span> — ${s.action}</div>`; });
        h += `</div>`;
      }
      h += `</div><div class="btn-row">
    <button class="btn" onclick="goBack()">← Back</button>
    <button class="btn btn-accent" onclick="restart()">↺ Start Over</button>
  </div>`;
      c.innerHTML = h;
    }

    function goBack() { path = path.slice(0, -1); current = path.length === 0 ? 'root' : path[path.length - 1].next; renderBuild(); }
    function restart() { path = []; current = 'root'; renderBuild(); }

    function renderNew() {
      const c = document.getElementById('new-content');
      c.innerHTML = NEW_ITEMS.map(item => {
        const stats = item.stats.map(s => `<div class="new-stat"><strong>${s.s}:</strong> ${s.v}</div>`).join('');
        const best = item.best.map(b => `<div class="sit-item">✓ ${b}</div>`).join('');
        const avoid = item.avoid.map(a => `<div class="sit-item">✗ ${a}</div>`).join('');
        const syn = item.synergy.map(s => `<div class="sit-item">⟳ ${s}</div>`).join('');
        return `<div class="new-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:.625rem">
        <span style="font-size:24px">${item.icon}</span>
        <div>
          <div style="font-size:15px;font-weight:600;color:var(--text)">${item.name} <span class="new-badge">NEW ${item.patch}</span></div>
          <div style="font-size:12px;color:var(--muted)">${item.type} · ${item.role}</div>
        </div>
      </div>
      ${stats}
      <div class="new-passive"><span class="pname">${item.passive.name}:</span> ${item.passive.text}</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:.5rem">${item.use}</div>
      <div class="new-section">Best for</div>${best}
      <div class="new-section">Avoid when</div>${avoid}
      <div class="new-section">Key synergies</div>${syn}
    </div>`;
      }).join('');
    }

    function renderSit() {
      const c = document.getElementById('sit-content');
      c.innerHTML = SITUATIONAL.map((s, i) => {
        const items = s.items.map(it => `<div class="sit-item"><strong>${it.t}</strong> — ${it.d}</div>`).join('');
        return `<div class="sit-card">
      <div class="sit-head" onclick="toggleSit(${i})">
        <span class="sit-title">${s.title}</span>
        <span class="tag ${s.tag}" style="margin-left:8px">${s.label}</span>
        <span class="arrow" id="arr-${i}">▶</span>
      </div>
      <div class="sit-body" id="sit-${i}">${items}</div>
    </div>`;
      }).join('');
    }

    function toggleSit(i) {
      const b = document.getElementById('sit-' + i);
      const a = document.getElementById('arr-' + i);
      const open = b.classList.toggle('open');
      a.style.transform = open ? 'rotate(90deg)' : 'none';
    }

    function renderCombos() {
      const c = document.getElementById('combo-content');
      const rc = { phys: 't-phys', mag: 't-mag', tank: 't-tank', bruiser: 't-bruiser', sup: 't-sup', sword: 't-sword' };
      const rl = { phys: 'Physical', mag: 'Mage', tank: 'Tank', bruiser: 'Bruiser', sup: 'Support', sword: 'Swordsman' };
      c.innerHTML = COMBOS.map(cb => {
        const pills = cb.items.map(i => {
          const isNew = i.includes('NEW');
          return `<span class="combo-item${isNew ? ' new' : ''}">${i}</span>`;
        }).join('');
        const newBadge = cb.newCombo ? `<span class="new-badge" style="margin-left:6px">NEW ${cb.patch || '0.9.7'}</span>` : '';
        return `<div class="combo-card${cb.newCombo ? ' is-new' : ''}">
      <div class="combo-head">
        <span style="font-size:20px">${cb.icon}</span>
        <div class="combo-title">${cb.title}${newBadge}</div>
        <span class="tag ${rc[cb.role] || 't-neu'}" style="margin-left:auto;flex-shrink:0">${rl[cb.role] || ''}</span>
      </div>
      <div class="combo-sub">${cb.sub}</div>
      <div class="combo-items">${pills}</div>
      <div class="combo-why">${cb.why}</div>
    </div>`;
      }).join('');
    }

    renderBuild();
  </script>
