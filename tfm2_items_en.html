<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>TFM2 — Item Builder</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent
    }

    :root {
      --bg: #0f0f12;
      --surface: #1a1a22;
      --card: #22222e;
      --border: #2e2e3e;
      --accent: #7b6ff0;
      --accent-bg: #1e1b3a;
      --accent-text: #a89cf5;
      --text: #e8e8f0;
      --muted: #888899;
      --sub: #555566;
      --warn: #c9962a;
      --warn-bg: #2a2010;
      --phys: #d4882a;
      --phys-bg: #2a1e0a;
      --mag: #7b6ff0;
      --mag-bg: #1e1b3a;
      --tank: #4caf7a;
      --tank-bg: #0f2018;
      --sup: #c06ab0;
      --sup-bg: #2a1028;
      --sword: #e0a030;
      --sword-bg: #2a2008;
      --new: #e05555;
      --new-bg: #2a1010;
      --radius: 8px
    }

    html,
    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 15px;
      line-height: 1.6
    }

    #app {
      max-width: 740px;
      margin: 0 auto;
      padding: 1.25rem 1rem 4rem
    }

    .app-header {
      margin-bottom: 1.25rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border)
    }

    .app-header h1 {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 3px
    }

    .app-header p {
      font-size: 13px;
      color: var(--muted)
    }

    .patch-badge {
      display: inline-block;
      margin-top: .5rem;
      padding: 3px 9px;
      background: var(--new-bg);
      color: var(--new);
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      border: 1px solid var(--new)
    }

    .tabs {
      display: flex;
      gap: 3px;
      margin-top: .75rem;
      background: var(--surface);
      border-radius: var(--radius);
      padding: 3px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch
    }

    .tab {
      flex: 0 0 auto;
      padding: .45rem .6rem;
      text-align: center;
      font-size: 11px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--muted);
      border: none;
      background: none;
      white-space: nowrap;
      -webkit-appearance: none;
      transition: all .15s
    }

    .tab.active {
      background: var(--card);
      color: var(--text);
      font-weight: 500
    }

    .breadcrumb {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
      margin-bottom: 1rem;
      min-height: 20px
    }

    .crumb {
      font-size: 12px;
      color: var(--muted);
      cursor: pointer;
      padding: 2px 0
    }

    .crumb:hover {
      color: var(--accent-text)
    }

    .crumb.active {
      color: var(--text);
      font-weight: 500;
      cursor: default
    }

    .sep {
      font-size: 11px;
      color: var(--sub)
    }

    .q-label {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: .7rem;
      line-height: 1.5
    }

    .choices {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 7px;
      margin-bottom: .875rem
    }

    .choice {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .75rem .85rem;
      cursor: pointer;
      transition: border-color .15s, background .15s;
      text-align: left;
      -webkit-appearance: none
    }

    .choice:hover,
    .choice:active {
      border-color: var(--accent);
      background: var(--accent-bg)
    }

    .choice:hover .ct {
      color: var(--accent-text)
    }

    .ct {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px;
      line-height: 1.3
    }

    .cd {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.4
    }

    .result-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem;
      margin-bottom: .75rem
    }

    .result-head {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: .75rem
    }

    .result-icon {
      font-size: 22px;
      flex-shrink: 0;
      margin-top: 2px
    }

    .result-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      line-height: 1.2
    }

    .result-meta {
      font-size: 12px;
      color: var(--muted)
    }

    .gold-badge {
      display: inline-block;
      padding: 2px 7px;
      background: var(--warn-bg);
      color: var(--warn);
      border-radius: 10px;
      font-size: 11px;
      font-weight: 500;
      margin-left: 5px
    }

    .new-badge {
      display: inline-block;
      padding: 2px 6px;
      background: var(--new-bg);
      color: var(--new);
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      margin-left: 5px;
      vertical-align: middle
    }

    .items-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: .75rem
    }

    .item-row {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: .55rem .65rem;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border)
    }

    .item-row.is-new {
      border-color: var(--new);
      background: var(--new-bg)
    }

    .item-num {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-bg);
      color: var(--accent-text);
      font-size: 11px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px
    }

    .item-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 2px
    }

    .item-cost {
      font-size: 11px;
      color: var(--muted);
      margin-bottom: 2px
    }

    .item-why {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.4
    }

    .swaps {
      padding-top: .65rem;
      border-top: 1px solid var(--border)
    }

    .swaps-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--sub);
      margin-bottom: .45rem
    }

    .swap {
      font-size: 12px;
      color: var(--muted);
      padding: .3rem 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.5
    }

    .swap:last-child {
      border-bottom: none
    }

    .swap-if {
      color: var(--warn);
      font-weight: 500
    }

    .tag {
      display: inline-block;
      font-size: 10px;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 10px;
      vertical-align: middle
    }

    .t-phys {
      background: var(--phys-bg);
      color: var(--phys)
    }

    .t-mag {
      background: var(--mag-bg);
      color: var(--mag)
    }

    .t-tank {
      background: var(--tank-bg);
      color: var(--tank)
    }

    .t-sup {
      background: var(--sup-bg);
      color: var(--sup)
    }

    .t-sword {
      background: var(--sword-bg);
      color: var(--sword)
    }

    .t-new {
      background: var(--new-bg);
      color: var(--new)
    }

    .t-neu {
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border)
    }

    .btn-row {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-top: .625rem
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 13px;
      padding: .42rem .8rem;
      border-radius: var(--radius);
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      -webkit-appearance: none;
      transition: all .15s
    }

    .btn:hover,
    .btn:active {
      color: var(--text);
      border-color: var(--accent)
    }

    .btn-accent {
      background: var(--accent-bg);
      color: var(--accent-text);
      border-color: var(--accent)
    }

    .sit-grid,
    .combo-grid,
    .new-grid {
      display: flex;
      flex-direction: column;
      gap: 9px
    }

    .sit-card,
    .combo-card,
    .new-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: .85rem 1rem
    }

    .new-card {
      border-color: var(--new)
    }

    .sit-head {
      display: flex;
      align-items: center;
      gap: 7px;
      cursor: pointer
    }

    .sit-title {
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      line-height: 1.3
    }

    .arrow {
      margin-left: auto;
      font-size: 11px;
      color: var(--sub);
      transition: transform .2s;
      flex-shrink: 0
    }

    .sit-body {
      display: none;
      margin-top: .55rem;
      padding-top: .55rem;
      border-top: 1px solid var(--border)
    }

    .sit-body.open {
      display: block
    }

    .sit-item {
      font-size: 12px;
      color: var(--muted);
      padding: .3rem 0;
      border-bottom: 1px solid var(--border);
      line-height: 1.5
    }

    .sit-item:last-child {
      border-bottom: none
    }

    .sit-item strong {
      color: var(--text);
      font-weight: 500
    }

    .combo-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 3px
    }

    .combo-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--text)
    }

    .combo-sub {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: .55rem
    }

    .combo-items {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: .45rem
    }

    .combo-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 11px;
      color: var(--text)
    }

    .combo-item.new {
      border-color: var(--new);
      color: var(--new)
    }

    .combo-why {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5
    }

    .new-stat {
      font-size: 12px;
      color: var(--muted);
      margin: .3rem 0;
      line-height: 1.5
    }

    .new-stat strong {
      color: var(--text)
    }

    .new-passive {
      background: var(--surface);
      border-radius: var(--radius);
      padding: .5rem .7rem;
      font-size: 12px;
      color: var(--muted);
      margin: .5rem 0;
      line-height: 1.5;
      border: 1px solid var(--border)
    }

    .new-passive .pname {
      color: var(--new);
      font-weight: 600
    }

    .new-section {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      color: var(--sub);
      margin: .75rem 0 .4rem
    }
  </style>
</head>

<body>
  <div id="app">
    <div class="app-header">
      <h1>TFM2 — Item Builder</h1>
      <p>Pick your role and situation → get the right build</p>
      <div class="patch-badge">🆕 Patch 0.9.7 — Stormsurge &amp; Ravenous Hydra added</div>
      <div class="tabs">
        <button class="tab active" onclick="switchTab('build',this)">🎯 Build Picker</button>
        <button class="tab" onclick="switchTab('new',this)">🆕 New Items</button>
        <button class="tab" onclick="switchTab('sit',this)">⚡ Situational</button>
        <button class="tab" onclick="switchTab('combos',this)">💡 Combos</button>
      </div>
    </div>
    <div id="build-tab">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="content"></div>
    </div>
    <div id="new-tab" style="display:none">
      <div class="new-grid" id="new-content"></div>
    </div>
    <div id="sit-tab" style="display:none">
      <div class="sit-grid" id="sit-content"></div>
    </div>
    <div id="combos-tab" style="display:none">
      <div class="combo-grid" id="combo-content"></div>
    </div>
  </div>
  <script>
    // ── ALL BUILDS ────────────────────────────────────────────────────────────────
    const B = {
      // ADC
      adc_crit: {
        label: "Crit Machine", sub: "Standard ADC, no heavy tanks", role: "phys", icon: "🏹",
        items: [
          { name: "Infinity Edge", cost: 1900, why: "50% crit + 30% crit damage from item 1. Every second hit is a critical" },
          { name: "Hamstringer", cost: 2150, why: "75% crit + bleed 2s + 7% slow on every crit. Enemy can't escape" },
          { name: "Phantom Dancer", cost: 2000, why: "100% crit + 10% MS. Now every single hit crits" },
          { name: "Deathblade", cost: 2000, why: "×1.25 to all your AD — the final multiplier that makes everything stronger" }
        ],
        swaps: [
          { cond: "2+ tanks", action: "4th: Lord Dominik's instead of Deathblade" },
          { cond: "Enemies have healing", action: "4th: Mortal Reminder instead of Deathblade" },
          { cond: "Enemies buy Randuin's", action: "2nd: Kraken Slayer instead of Hamstringer" }
        ]
      },
      adc_antitank: {
        label: "Tank Shredder", sub: "Enemies have 2+ heavy tanks (3000+ HP)", role: "phys", icon: "🗡️",
        items: [
          { name: "Lord Dominik's Regards", cost: 2000, why: "Immediately ignores 35% armor + bonus damage scales with target max HP (up to +15%)" },
          { name: "Kraken Slayer", cost: 2000, why: "Every 3rd attack: 150+ bonus damage, maximized at 25% enemy HP" },
          { name: "Infinity Edge", cost: 1900, why: "75% crit total — stack crit on top of tank shred" },
          { name: "Deathblade", cost: 2000, why: "Final ×1.25 multiplier" }
        ],
        swaps: [
          { cond: "Enemies have healing", action: "3rd: Mortal Reminder instead of Infinity Edge" },
          { cond: "Need mobility", action: "3rd: Stormrazor instead of Infinity Edge" }
        ]
      },
      adc_antiheal: {
        label: "ADC vs Healing", sub: "Enemy team has strong heals", role: "phys", icon: "💉",
        items: [
          { name: "Infinity Edge", cost: 1900, why: "Core crit foundation" },
          { name: "Mortal Reminder", cost: 2000, why: "REQUIRED — reduces enemy healing by 40% on physical damage" },
          { name: "Hamstringer", cost: 2150, why: "75% crit + slow — enemy can't run away to heal" },
          { name: "Phantom Dancer", cost: 2000, why: "100% crit + 10% MS for sustained pressure" }
        ],
        swaps: [{ cond: "Healing is no longer a threat", action: "Swap Mortal Reminder for Deathblade" }]
      },
      adc_speed: {
        label: "Lightning & Speed", sub: "Mobility + fast tempo (sub-12 min)", role: "phys", icon: "⚡",
        items: [
          { name: "Stormrazor", cost: 2200, why: "Charges up → lightning strike 100 magic damage + 35% MS for 1.5s" },
          { name: "Phantom Dancer", cost: 2000, why: "50% crit + 100% AS + 10% MS — extremely fast" },
          { name: "Hamstringer", cost: 2150, why: "75% crit + bleed — adds control to the speed" },
          { name: "Deathblade", cost: 2000, why: "Final ×1.25 AD multiplier" }
        ],
        swaps: [
          { cond: "Enemies are tanky", action: "4th: Lord Dominik's" },
          { cond: "Enemies heal a lot", action: "4th: Mortal Reminder" }
        ]
      },
      adc_defense: {
        label: "ADC with Defense", sub: "One defensive item in the build", role: "phys", icon: "🛡️",
        items: [
          { name: "Infinity Edge", cost: 1900, why: "50% crit from item 1 — keep damage as the foundation" },
          { name: "Sterak's Gage", cost: 2000, why: "DEFENSIVE SLOT: 650 HP + shield equal to 60% max HP at 30% health. Saves you from one burst combo" },
          { name: "Hamstringer", cost: 2150, why: "75% crit + slow" },
          { name: "Deathblade", cost: 2000, why: "Final ×1.25 multiplier" }
        ],
        swaps: [
          { cond: "Enemies have 2+ mages", action: "2nd: Wit's End instead of Sterak's (130 MR + 65% AS + 30% tenacity)" },
          { cond: "Enemies are physical", action: "2nd: Randuin's Omen instead of Sterak's (−30% crit damage)" },
          { cond: "No real threat", action: "2nd: Phantom Dancer — go back to full crit" }
        ]
      },
      adc_melee: {
        label: "Melee ADC (Yasuo/Yone)", sub: "Melee carry on bot lane", role: "sword", icon: "⚔️",
        items: [
          { name: "Eclipse", cost: 1950, why: "Double-hit every 6s: mark → second hit = 8% max HP + shield 139 damage. Perfect rhythm for melee" },
          { name: "Sundered Sky", cost: 2000, why: "Free guaranteed crit every 20s + heals 10% missing HP. Sustain built in" },
          { name: "Death's Dance", cost: 2100, why: "75 armor + 25% damage spread over time + heals on kill. Survive melee range fights" },
          { name: "Deathblade", cost: 2000, why: "×1.25 AD — the final multiplier" }
        ],
        swaps: [
          { cond: "Enemies heavy AP", action: "3rd: Dragon's Claw instead of Death's Dance" },
          { cond: "Enemies very tanky", action: "4th: Cyclosword instead of Deathblade (10% current HP)" },
          { cond: "Need survivability", action: "4th: Sterak's Gage instead of Deathblade" }
        ]
      },
      // ASSASSIN
      ass_snowball: {
        label: "Snowball Assassin", sub: "Winning early fights", role: "phys", icon: "☄️",
        items: [
          { name: "Hubris", cost: 1950, why: "Buy FIRST — cheaper! Each kill: +12 AD for 90s (stackable infinitely)" },
          { name: "Axiom Arc", cost: 1900, why: "Lethality reduces ult cooldown by 10%+. More ult = more kills" },
          { name: "Bastionbreaker", cost: 1950, why: "Kill → next tower attack deals 200 + 20% AD true damage for free" },
          { name: "Collector", cost: 2100, why: "Executes below 6% HP + 25 bonus gold per kill. No one escapes" }
        ],
        swaps: [
          { cond: "Not getting early kills", action: "1st: Opportunity instead of Hubris" },
          { cond: "Enemies buying shields", action: "1st: Serpent's Fang instead of Hubris" }
        ]
      },
      ass_antishield: {
        label: "Shield Breaker", sub: "Enemies building Sterak's and shields", role: "phys", icon: "🗡️",
        items: [
          { name: "Serpent's Fang", cost: 1800, why: "Cheapest. Damage to shielded target = +85 bonus AD. Their shield is no longer protection" },
          { name: "Opportunity", cost: 1950, why: "7s out of combat → +7% lethality. Lethal from the bushes" },
          { name: "Hubris", cost: 1950, why: "Stacking AD through kills" },
          { name: "Collector", cost: 2100, why: "Execute + gold — the finisher nobody survives" }
        ],
        swaps: [
          { cond: "Enemies not buying shields", action: "1st: Hubris instead of Serpent's Fang" },
          { cond: "Enemies are very tanky", action: "3rd: Cyclosword instead of Hubris (10% current HP damage)" }
        ]
      },
      ass_ult: {
        label: "Ultimate Machine", sub: "Ultimate is your primary weapon", role: "phys", icon: "🔱",
        items: [
          { name: "Axiom Arc", cost: 1900, why: "−10% ult CD immediately, scales with lethality up to −17%+" },
          { name: "Hubris", cost: 1950, why: "115 AD + kill stacks + more lethality = lower ult CD" },
          { name: "Voltaic Cyclosword", cost: 1950, why: "Charges → 10% current HP bonus damage. Kills tanks where ult alone can't" },
          { name: "Bastionbreaker", cost: 1950, why: "Kill → free tower damage after every ult" }
        ],
        swaps: [{ cond: "Enemies have huge HP pools", action: "3rd: Blade of the Ruined King instead of Cyclosword" }]
      },
      ass_burst: {
        label: "Pure Burst", sub: "One or two hits = death", role: "phys", icon: "💀",
        items: [
          { name: "Opportunity", cost: 1950, why: "7s in shadows → +7% lethality. First hit from bushes is maximally lethal" },
          { name: "Deathblade", cost: 2000, why: "×1.25 AD. With high lethality, each hit kills squishy targets" },
          { name: "Hubris", cost: 1950, why: "Kill stacks. After 3 kills — nearly anything dies" },
          { name: "Collector", cost: 2100, why: "Execute at <6% HP. No one will survive with 1 HP" }
        ],
        swaps: [
          { cond: "Enemies have shields", action: "1st: Serpent's Fang instead of Opportunity" },
          { cond: "Need cooldown reduction", action: "2nd: Axiom Arc instead of Deathblade" }
        ]
      },
      ass_jungle: {
        label: "Jungle Assassin", sub: "Ganks, pressure, tower kills", role: "phys", icon: "🌲",
        items: [
          { name: "Bastionbreaker", cost: 1950, why: "Kill at gank → free tower. Ideal jungler: gank + tower = map pressure" },
          { name: "Hubris", cost: 1950, why: "AD stacks through all kills and ganks. Snowball across the whole map" },
          { name: "Axiom Arc", cost: 1900, why: "Ult more often = gank more often. Ult cooldown is critical for junglers" },
          { name: "Collector", cost: 2100, why: "+25 gold per kill = faster items. Execute — no one walks away alive" }
        ],
        swaps: [
          { cond: "Need more damage", action: "4th: Cyclosword instead of Collector" },
          { cond: "Enemies buy shields", action: "1st: Serpent's Fang instead of Bastionbreaker" }
        ]
      },
      // SWORDSMAN (Yasuo/Yone)
      sword_mid: {
        label: "Swordsman Mid", sub: "Yasuo / Yone style on midlane", role: "sword", icon: "⚔️",
        items: [
          { name: "Eclipse", cost: 1950, why: "Double-hit every 6s: mark target → second hit = 8% max HP + 139 shield. Perfect for melee auto-attack rhythm" },

    // ── ENGINE ────────────────────────────────────────────────────────────────────
    let path = [], current = "root";

    function switchTab(tab, btn) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      btn.classList.add('active');
      ['build', 'new', 'sit', 'combos'].forEach(t => {
        document.getElementById(t + '-tab').style.display = t === tab ? '' : 'none';
      });
      if (tab === 'new') renderNew();
      if (tab === 'sit') renderSit();
      if (tab === 'combos') renderCombos();
    }

    function roleTag(r) {
      const m = { phys: ['t-phys', 'Physical'], mag: ['t-mag', 'Mage'], tank: ['t-tank', 'Tank/Bruiser'], sup: ['t-sup', 'Support'], sword: ['t-sword', 'Swordsman'] };
      const [cls, label] = m[r] || ['t-neu', r];
      return `<span class="tag ${cls}">${label}</span>`;
    }

    function renderBC() {
      const bc = document.getElementById('breadcrumb');
      const steps = [{ label: 'Start' }, ...path.map(p => ({ label: p.label }))];
      bc.innerHTML = steps.map((s, i) => {
        const last = i === steps.length - 1;
        return `<span class="crumb${last ? ' active' : ''}" data-idx="${i}">${s.label}</span>${last ? '' : `<span class="sep">›</span>`}`;
      }).join('');
      bc.querySelectorAll('.crumb:not(.active)').forEach(el => {
        el.onclick = () => {
          const idx = parseInt(el.dataset.idx);
          path = path.slice(0, idx);
          current = path.length === 0 ? 'root' : path[path.length - 1].next;
          renderBuild();
        };
      });
    }

    function renderBuild() {
      renderBC();
      const c = document.getElementById('content');
      if (B[current]) { renderResult(current, c); return; }
      const node = TREE[current];
      if (!node) { c.innerHTML = '<p style="color:var(--muted)">Navigation error</p>'; return; }
      let h = `<p class="q-label">${node.q}</p><div class="choices">`;
      node.choices.forEach(ch => {
        h += `<div class="choice" data-next="${ch.n}" data-label="${ch.l}"><div class="ct">${ch.l}</div><div class="cd">${ch.d || ''}</div></div>`;
      });
      h += `</div>`;
      c.innerHTML = h;
      c.querySelectorAll('.choice').forEach(el => {
        el.onclick = () => { path.push({ label: el.dataset.label, next: el.dataset.next }); current = el.dataset.next; renderBuild(); };
      });
    }

    function renderResult(id, c) {
      const b = B[id];
      const namedItems = b.items.filter(i => i.cost > 0);
      const total = namedItems.reduce((a, i) => a + i.cost, 0);
      let h = `<div class="result-card"><div class="result-head"><div class="result-icon">${b.icon}</div><div>
    <div class="result-title">${b.label}</div>
    <div class="result-meta">${b.sub} &nbsp;${roleTag(b.role)}<span class="gold-badge">~${total.toLocaleString()} gold (named items)</span></div>
  </div></div><div class="items-list">`;
      b.items.forEach((item, i) => {
        const newCls = item.isNew ? ' is-new' : '';
        const newBadge = item.isNew ? `<span class="new-badge">NEW 0.9.7</span>` : '';
        h += `<div class="item-row${newCls}"><div class="item-num">${i + 1}</div><div>
      <div class="item-name">${item.name}${newBadge}</div>
      ${item.cost > 0 ? `<div class="item-cost">${item.cost.toLocaleString()} gold</div>` : ''}
      <div class="item-why">${item.why}</div>
    </div></div>`;
      });
      h += `</div>`;
      if (b.swaps && b.swaps.length) {
        h += `<div class="swaps"><div class="swaps-title">Situational Swaps</div>`;
        b.swaps.forEach(s => { h += `<div class="swap"><span class="swap-if">If ${s.cond}</span> — ${s.action}</div>`; });
        h += `</div>`;
      }
      h += `</div><div class="btn-row">
    <button class="btn" onclick="goBack()">← Back</button>
    <button class="btn btn-accent" onclick="restart()">↺ Start Over</button>
  </div>`;
      c.innerHTML = h;
    }

    function goBack() { path = path.slice(0, -1); current = path.length === 0 ? 'root' : path[path.length - 1].next; renderBuild(); }
    function restart() { path = []; current = 'root'; renderBuild(); }

    function renderNew() {
      const c = document.getElementById('new-content');
      c.innerHTML = NEW_ITEMS.map(item => {
        const stats = item.stats.map(s => `<div class="new-stat"><strong>${s.s}:</strong> ${s.v}</div>`).join('');
        const best = item.best.map(b => `<div class="sit-item">✓ ${b}</div>`).join('');
        const avoid = item.avoid.map(a => `<div class="sit-item">✗ ${a}</div>`).join('');
        const syn = item.synergy.map(s => `<div class="sit-item">⟳ ${s}</div>`).join('');
        return `<div class="new-card">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:.625rem">
        <span style="font-size:24px">${item.icon}</span>
        <div>
          <div style="font-size:15px;font-weight:600;color:var(--text)">${item.name} <span class="new-badge">NEW 0.9.7</span></div>
          <div style="font-size:12px;color:var(--muted)">${item.type} · ${item.role}</div>
        </div>
      </div>
      ${stats}
      <div class="new-passive"><span class="pname">${item.passive.name}:</span> ${item.passive.text}</div>
      <div style="font-size:12px;color:var(--muted);line-height:1.5;margin-bottom:.5rem">${item.use}</div>
      <div class="new-section">Best for</div>${best}
      <div class="new-section">Avoid when</div>${avoid}
      <div class="new-section">Key synergies</div>${syn}
    </div>`;
      }).join('');
    }

    function renderSit() {
      const c = document.getElementById('sit-content');
      c.innerHTML = SITUATIONAL.map((s, i) => {
        const items = s.items.map(it => `<div class="sit-item"><strong>${it.t}</strong> — ${it.d}</div>`).join('');
        return `<div class="sit-card">
      <div class="sit-head" onclick="toggleSit(${i})">
        <span class="sit-title">${s.title}</span>
        <span class="tag ${s.tag}" style="margin-left:8px">${s.label}</span>
        <span class="arrow" id="arr-${i}">▶</span>
      </div>
      <div class="sit-body" id="sit-${i}">${items}</div>
    </div>`;
      }).join('');
    }

    function toggleSit(i) {
      const b = document.getElementById('sit-' + i);
      const a = document.getElementById('arr-' + i);
      const open = b.classList.toggle('open');
      a.style.transform = open ? 'rotate(90deg)' : 'none';
    }

    function renderCombos() {
      const c = document.getElementById('combo-content');
      const rc = { phys: 't-phys', mag: 't-mag', tank: 't-tank', sup: 't-sup', sword: 't-sword' };
      const rl = { phys: 'Physical', mag: 'Mage', tank: 'Tank/Bruiser', sup: 'Support', sword: 'Swordsman' };
      c.innerHTML = COMBOS.map(cb => {
        const pills = cb.items.map(i => {
          const isNew = i.includes('NEW');
          return `<span class="combo-item${isNew ? ' new' : ''}">${i}</span>`;
        }).join('');
        const newBadge = cb.newCombo ? `<span class="new-badge" style="margin-left:6px">NEW 0.9.7</span>` : '';
        return `<div class="combo-card${cb.newCombo ? ' is-new' : ''}">
      <div class="combo-head">
        <span style="font-size:20px">${cb.icon}</span>
        <div class="combo-title">${cb.title}${newBadge}</div>
        <span class="tag ${rc[cb.role] || 't-neu'}" style="margin-left:auto;flex-shrink:0">${rl[cb.role] || ''}</span>
      </div>
      <div class="combo-sub">${cb.sub}</div>
      <div class="combo-items">${pills}</div>
      <div class="combo-why">${cb.why}</div>
    </div>`;
      }).join('');
    }

    renderBuild();
  </script>
