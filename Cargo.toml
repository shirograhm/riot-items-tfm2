[package]
name = "riot_items_tfm2"
version = "0.6.5"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# Stable-ABI mod. Builds with any Rust toolchain and keeps loading across game
# updates — no pinned nightly and no prebuilt engine rlibs. The SDK crate is
# plain source; the uploader installs it at ../mod-api-stable if it is missing.
[dependencies]
mod-api-stable = { path = "../mod-api-stable" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[workspace]

# Required, not an optimization choice. From 0.5.3 the SDK's engine rlibs ship
# LLVM bitcode instead of object code, so `link.exe` rejects libgame_core with
# LNK1136 unless rustc does the codegen itself. Only matters because
# `src/hook.rs` links game_core; drop it if the hook ever goes away.
[profile.release]
lto = "fat"
