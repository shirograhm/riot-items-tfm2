[package]
name = "riot_items_tfm2"
version = "0.11.12-beta"
edition = "2021"

[lib]
crate-type = ["cdylib"]

# Stable-ABI mod. Builds with any Rust toolchain and keeps loading across game
# updates — no pinned nightly and no prebuilt engine rlibs. The SDK crate is
# plain source; the uploader installs it at ../mod-api-stable if it is missing.
[dependencies]
mod-api-stable = { path = "../mod-api-stable" }
rand = "0.10.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# build.rs compiles text/item_classes.json into item_catalog.rs's CATEGORY_OF.
[build-dependencies]
serde_json = "1"

[workspace]
